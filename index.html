<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bubbles bulk</title>
<link rel="icon" type="image/jpg" href="WEEEEB.png">


<style>

  /* ================= CUSTOM CURSOR ================= */

 /*

/* ================= ROOT ================= */

:root {
  --bg: #1B1A14;
  --accent: #2473db;
  --accent-light: #3b82f6;
  --accent-glow: #60a5fa;
  --card: #23221c;
  --text: #ffffff;
  --muted: #9ca3af;
  --dark-muted: #6b7280;
  --success: #10b981;
}

/* ================= BODY ================= */

body {
  margin: 0;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}





/* Animated background gradient */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 50%, rgba(36, 115, 219, 0.05) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(36, 115, 219, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 1;
}

/* ================= HEADER ================= */

.header {
  padding: 24px 20px;
  text-align: center;
  position: relative;
  z-index: 10;
  background: linear-gradient(180deg, rgba(27, 26, 20, 0.8) 0%, transparent 100%);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  cursor: grab;
  transition: all 0.2s ease;
  display: flex;
  justify-content: center;
  align-items: center;
}

.header:active {
  cursor: grabbing;
}

.header.dragging {
  background: linear-gradient(180deg, rgba(27, 26, 20, 1) 0%, rgba(27, 26, 20, 0.5) 100%);
  box-shadow: 0 8px 32px rgba(36, 115, 219, 0.2);
}

.logo {
  height: 56px;
  transition: transform 0.3s ease;
  pointer-events: none;
}

.logo:hover {
  transform: scale(1.05);
}

/* ================= REGISTRATION BUTTON ================= */

.reg-btn {
  position: absolute;
  right: 30px;
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9rem;
  box-shadow: 0 4px 15px rgba(36, 115, 219, 0.3);
  z-index: 20;
}

.reg-btn:hover {
  background: var(--accent-light);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(36, 115, 219, 0.4);
}

/* ================= BUBBLE CONTAINER ================= */

.bubble-container {
  position: absolute;
  width: 50px;
  height: 50px;
  cursor: grab;
  z-index: 100;
  touch-action: none;
}

.bubble-container:active {
  cursor: grabbing;
}

.bubble-container.dragging {
  z-index: 1000;
}

/* ================= BUBBLE ================= */

.bubble {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid var(--accent);
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 0 rgba(36, 115, 219, 0.5);
  background: var(--card);
}

.bubble-container.dragging .bubble {
  z-index: 1000;
  box-shadow: 0 0 40px rgba(36, 115, 219, 0.8),
              0 0 80px rgba(36, 115, 219, 0.4),
              inset 0 0 20px rgba(255, 255, 255, 0.15);
  border-color: var(--accent-glow);
}

.bubble-container:hover .bubble {
  transform: scale(1.25);
  box-shadow: 0 0 30px rgba(36, 115, 219, 0.6),
              0 0 60px rgba(36, 115, 219, 0.3),
              inset 0 0 20px rgba(255, 255, 255, 0.1);
  border-color: var(--accent-glow);
}

.bubble::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.bubble-container:hover .bubble::after {
  opacity: 1;
}

.bubble img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
  pointer-events: none;
}

.bubble-container:hover .bubble img {
  transform: scale(1.1);
}

/* ================= ANIMATIONS ================= */

@keyframes float {
  0%, 100% { 
    transform: translateY(0) rotate(0deg);
  }
  50% { 
    transform: translateY(-12px) rotate(1.5deg);
  }
}

@keyframes clickPop {
  0% { 
    transform: scale(1);
    opacity: 1;
  }
  50% { 
    transform: scale(1.4);
    opacity: 0.8;
  }
  100% { 
    transform: scale(1);
    opacity: 1;
  }
}

/* ================= POPUP & MODAL ================= */

.popup, .modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 999;
  backdrop-filter: blur(8px);
}

.popup.active, .modal.active {
  opacity: 1;
  pointer-events: all;
}

.popup-card, .modal-card {
  background: linear-gradient(135deg, #1a1a16 0%, #23221c 100%);
  width: 340px;
  padding: 28px;
  border-radius: 28px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
              0 0 1px rgba(36, 115, 219, 0.3);
  animation: popupShow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

.modal-card {
  width: 400px;
  max-height: 90vh;
  overflow-y: auto;
  text-align: left;
}

.popup-card::before, .modal-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(36, 115, 219, 0.1) 0%, transparent 70%);
  pointer-events: none;
}

/* Banner */

.popup-banner {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s ease;
  background: #333;
}

.popup-banner:hover {
  transform: scale(1.02);
}

/* Text */

.association {
  font-size: 0.7rem;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  margin-bottom: 10px;
  text-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
}

#popupName {
  margin: 0 0 8px;
  font-size: 1.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#popupDesc {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 22px;
}

.favorite-title {
  font-size: 0.7rem;
  margin: 0 0 12px;
  color: var(--dark-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
}

/* ================= LINK BOX ================= */

.link-box {
  background: linear-gradient(135deg,
    rgba(59, 130, 246, 0.12),
    rgba(37, 99, 235, 0.06)
  );
  padding: 14px 16px;
  border-radius: 16px;
  border: 1.5px solid rgba(59, 130, 246, 0.25);
  display: flex;
  align-items: center;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background-size: 200% 100%;
}

.link-box::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
  transition: left 0.5s ease;
}

.link-box:hover::before {
  left: 100%;
}

.link-box:hover {
  background: linear-gradient(135deg,
    rgba(59, 130, 246, 0.2),
    rgba(37, 99, 235, 0.12)
  );
  border-color: rgba(96, 165, 250, 0.5);
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(36, 115, 219, 0.2);
}

.link-icon {
  width: 36px;
  height: 36px;
  background: rgba(59, 130, 246, 0.25);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-glow);
  margin-right: 12px;
  font-size: 1.2rem;
  transition: all 0.3s ease;
  flex-shrink: 0;
  pointer-events: none;
}

.link-box:hover .link-icon {
  background: rgba(59, 130, 246, 0.4);
  transform: scale(1.1) rotate(5deg);
}

.link-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-width: 0;
  pointer-events: none;
}

.link-label {
  font-size: 0.65rem;
  color: var(--muted);
  margin-bottom: 3px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.link-box a {
  color: var(--accent-glow);
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 500;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 0.3s ease;
}

.link-box:hover a {
  color: #ffffff;
}

.external-icon {
  color: var(--dark-muted);
  margin-left: 10px;
  font-size: 1rem;
  transition: all 0.3s ease;
  flex-shrink: 0;
  pointer-events: none;
}

.link-box:hover .external-icon {
  color: var(--accent-glow);
  transform: translate(2px, -2px);
}

/* Close */

.close {
  margin-top: 20px;
  font-size: 0.8rem;
  color: var(--dark-muted);
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: relative;
  user-select: none;
  text-align: center;
}

.close::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--accent-light);
  transition: all 0.3s ease;
  transform: translateX(-50%);
}

.close:hover {
  color: var(--text);
}

.close:hover::after {
  width: 30px;
}

/* ================= FORM STYLES ================= */

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 20px;
  color: white;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.form-group input, .form-group textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 12px 16px;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  box-sizing: border-box;
}

.form-group input:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 4px rgba(36, 115, 219, 0.1);
}

.form-group textarea {
  resize: vertical;
  min-height: 80px;
}

.file-input-wrapper {
  position: relative;
  overflow: hidden;
  display: inline-block;
  width: 100%;
}

.file-input-btn {
  display: block;
  background: rgba(255, 255, 255, 0.05);
  border: 1px dashed rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.3s ease;
}

.file-input-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--accent);
  color: white;
}

.file-input-wrapper input[type=file] {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.submit-btn {
  width: 100%;
  background: var(--accent);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
  box-shadow: 0 4px 15px rgba(36, 115, 219, 0.3);
}

.submit-btn:hover {
  background: var(--accent-light);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(36, 115, 219, 0.4);
}

.submit-btn:active {
  transform: translateY(0);
}

/* Animation */

@keyframes popupShow {
  from { 
    opacity: 0;
    transform: scale(0.9) translateY(20px);
  }
  to { 
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header" data-draggable="true">
  <img src="BULKLOGO.png" class="logo">
  <button class="reg-btn" id="openRegBtn">Create Bubble</button>
</header>


<!-- POPUP -->

<div class="popup" id="popup">

  <div class="popup-card">

    <img id="popupBanner" class="popup-banner">

    <h2 id="popupName"></h2>

    <div class="association" id="popupAssociation">
      Association with BULK: SPEED
    </div>

    <p id="popupDesc"></p>

    <div class="favorite-title">
      Favorite content
    </div>

    <div class="link-box" id="popupLinkBox">

      <div class="link-icon">
        🔗
      </div>

      <div class="link-content">
        <span class="link-label">View Content</span>
        <a id="popupLink" target="_blank"></a>
      </div>

      <div class="external-icon">↗</div>

    </div>

    <div class="close" id="closeBtn">Close</div>

  </div>

</div>

<!-- REGISTRATION MODAL -->

<div class="modal" id="regModal">
  <div class="modal-card">
    <h2 class="modal-title">Create Your Bubble</h2>
    
    <form id="regForm">
      <div class="form-group">
        <label>➢ Link to your X profile</label>
        <input type="url" id="xProfile" placeholder="https://x.com/yourusername" required>
      </div>
      
      <div class="form-group">
        <label>➢ What do you associate BULK with?</label>
        <input type="text" id="bulkAssociation" placeholder="e.g. SPEED, COMMUNITY, FUTURE" required>
      </div>
      
      <div class="form-group">
        <label>➢ Link to your favorite Bulk Community content</label>
        <input type="url" id="favContent" placeholder="https://x.com/..." required>
      </div>
      
      <div class="form-group">
        <label>➢ Your avatar (bubble image)</label>
        <div class="file-input-wrapper">
          <div class="file-input-btn" id="avatarFileName">Choose avatar image...</div>
          <input type="file" id="avatarUpload" accept="image/*" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>➢ Your banner (popup image)</label>
        <div class="file-input-wrapper">
          <div class="file-input-btn" id="bannerFileName">Choose banner image...</div>
          <input type="file" id="bannerUpload" accept="image/*" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>➢ Your custom sound on click (optional)</label>
        <div class="file-input-wrapper">
          <div class="file-input-btn" id="audioFileName">Choose audio file...</div>
          <input type="file" id="customSound" accept="audio/*">
        </div>
      </div>
      
      <button type="submit" class="submit-btn">Create Bubble</button>
    </form>
    
    <div class="close" id="closeRegBtn">Cancel</div>
  </div>
</div>


<script>

/* ================= USERS ================= */

const users = [

  {
    name: "Crypost",
    association: "SPEED",
    description: "Passionate about high-speed transactions and community growth.",
    favoriteLink: "https://x.com/lamaCryp/status/2026645277881377145?s=20",
    avatar: "Crypostlogo.jpg",
    banner: "crypostbanner.jpg",
    audio: "crypost.mp3"
  }

];


/* ================= ELEMENTS ================= */

const popup = document.getElementById("popup");
const popupName = document.getElementById("popupName");
const popupDesc = document.getElementById("popupDesc");
const popupLink = document.getElementById("popupLink");
const popupBanner = document.getElementById("popupBanner");
const popupAssociation = document.getElementById("popupAssociation");
const popupLinkBox = document.getElementById("popupLinkBox");
const closeBtn = document.getElementById("closeBtn");

const regModal = document.getElementById("regModal");
const openRegBtn = document.getElementById("openRegBtn");
const closeRegBtn = document.getElementById("closeRegBtn");
const regForm = document.getElementById("regForm");
const avatarInput = document.getElementById("avatarUpload");
const avatarFileNameDisplay = document.getElementById("avatarFileName");
const bannerInput = document.getElementById("bannerUpload");
const bannerFileNameDisplay = document.getElementById("bannerFileName");
const audioFileInput = document.getElementById("customSound");
const audioFileNameDisplay = document.getElementById("audioFileName");

const header = document.querySelector('.header');


/* ================= MODAL LOGIC ================= */

openRegBtn.onclick = () => regModal.classList.add("active");
closeRegBtn.onclick = () => regModal.classList.remove("active");

regModal.onclick = e => {
  if(e.target === regModal) regModal.classList.remove("active");
};

avatarInput.onchange = () => {
  if (avatarInput.files.length > 0) {
    avatarFileNameDisplay.textContent = avatarInput.files[0].name;
    avatarFileNameDisplay.style.color = "var(--success)";
    avatarFileNameDisplay.style.borderColor = "var(--success)";
  }
};

bannerInput.onchange = () => {
  if (bannerInput.files.length > 0) {
    bannerFileNameDisplay.textContent = bannerInput.files[0].name;
    bannerFileNameDisplay.style.color = "var(--success)";
    bannerFileNameDisplay.style.borderColor = "var(--success)";
  }
};

audioFileInput.onchange = () => {
  if (audioFileInput.files.length > 0) {
    audioFileNameDisplay.textContent = audioFileInput.files[0].name;
    audioFileNameDisplay.style.color = "var(--success)";
    audioFileNameDisplay.style.borderColor = "var(--success)";
  }
};

regForm.onsubmit = (e) => {
  e.preventDefault();
  
  const xUrl = document.getElementById("xProfile").value;
  const association = document.getElementById("bulkAssociation").value;
  const favLink = document.getElementById("favContent").value;
  
  // Extract username from X URL for the name
  let name = "User";
  try {
    const url = new URL(xUrl);
    const pathParts = url.pathname.split('/').filter(p => p);
    if (pathParts.length > 0) name = "@" + pathParts[0];
  } catch(e) {}

  // Handle avatar file
  let avatarUrl = "BULKLOGO.png";
  if (avatarInput.files.length > 0) {
    avatarUrl = URL.createObjectURL(avatarInput.files[0]);
  }

  // Handle banner file
  let bannerUrl = "BULKLOGO.png";
  if (bannerInput.files.length > 0) {
    bannerUrl = URL.createObjectURL(bannerInput.files[0]);
  }

  const newUser = {
    name: name,
    association: association,
    description: `X Profile: ${xUrl}`,
    favoriteLink: favLink,
    avatar: avatarUrl,
    banner: bannerUrl,
    audio: null
  };

  // Handle audio file if provided
  if (audioFileInput.files.length > 0) {
    const file = audioFileInput.files[0];
    newUser.audio = URL.createObjectURL(file);
  }

  createBubble(newUser);
  
  // Reset and close
  regForm.reset();
  avatarFileNameDisplay.textContent = "Choose avatar image...";
  avatarFileNameDisplay.style.color = "var(--muted)";
  avatarFileNameDisplay.style.borderColor = "rgba(255, 255, 255, 0.2)";
  bannerFileNameDisplay.textContent = "Choose banner image...";
  bannerFileNameDisplay.style.color = "var(--muted)";
  bannerFileNameDisplay.style.borderColor = "rgba(255, 255, 255, 0.2)";
  audioFileNameDisplay.textContent = "Choose audio file...";
  audioFileNameDisplay.style.color = "var(--muted)";
  audioFileNameDisplay.style.borderColor = "rgba(255, 255, 255, 0.2)";
  regModal.classList.remove("active");
};


/* ================= CLOSE POPUP ================= */

closeBtn.onclick = ()=> popup.classList.remove("active");

popup.onclick = e=>{
  if(e.target===popup) popup.classList.remove("active");
};

popupLinkBox.onclick = () => {
  if (popupLink.href) window.open(popupLink.href, '_blank');
};


/* ================= SOUND ================= */

function playSound(file){
  if(!file) return;
  const audio = new Audio(file);
  audio.play().catch(e => console.log("Audio play failed:", e));
}


/* ================= SHOW POPUP ================= */

function showPopup(user){

  popupName.textContent = user.name;
  popupDesc.textContent = user.description || "";
  popupAssociation.textContent = `Association with BULK: ${user.association || "NONE"}`;

  popupLink.textContent = user.favoriteLink;
  popupLink.href = user.favoriteLink;

  popupBanner.src = user.banner || "BULKLOGO.png";

  popup.classList.add("active");
}


/* ================= UNIVERSAL DRAG & DROP SYSTEM ================= */

class DraggableElement {
  constructor(element, options = {}) {
    this.element = element;
    this.isDragging = false;
    this.startX = 0;
    this.startY = 0;
    this.clickThreshold = 5; // pixels
    this.clickStartX = 0;
    this.clickStartY = 0;
    this.hasMovedEnough = false;
    
    // Options for boundary constraints
    this.minY = options.minY || 0;
    this.maxY = options.maxY || window.innerHeight;
    this.minX = options.minX || 0;
    this.maxX = options.maxX || window.innerWidth;
    
    this.setupListeners();
  }

  setupListeners() {
    this.element.addEventListener('mousedown', (e) => this.onMouseDown(e));
    this.element.addEventListener('touchstart', (e) => this.onTouchStart(e));
  }

  onMouseDown(e) {
    // Don't drag if clicking on interactive elements inside
    if (e.target.closest('a, button, input, .close, .link-box, .reg-btn')) return;
    
    this.startDrag(e.clientX, e.clientY);
  }

  onTouchStart(e) {
    if (e.target.closest('a, button, input, .close, .link-box, .reg-btn')) return;
    
    const touch = e.touches[0];
    this.startDrag(touch.clientX, touch.clientY);
  }

  startDrag(clientX, clientY) {
    this.isDragging = true;
    this.startX = clientX;
    this.startY = clientY;
    this.clickStartX = clientX;
    this.clickStartY = clientY;
    this.hasMovedEnough = false;

    const onMouseMove = (e) => this.onMouseMove(e);
    const onTouchMove = (e) => this.onTouchMove(e);
    const onMouseUp = (e) => this.onMouseUp(e, onMouseMove, onTouchMove);
    const onTouchEnd = (e) => this.onTouchEnd(e, onMouseMove, onTouchMove);

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('mouseup', onMouseUp);
    document.addEventListener('touchend', onTouchEnd);

    // Store references for cleanup
    this.currentMouseMove = onMouseMove;
    this.currentTouchMove = onTouchMove;
    this.currentMouseUp = onMouseUp;
    this.currentTouchEnd = onTouchEnd;
  }

  onMouseMove = (e) => {
    if (!this.isDragging) return;
    this.updatePosition(e.clientX, e.clientY);
  }

  onTouchMove = (e) => {
    if (!this.isDragging) return;
    e.preventDefault();
    const touch = e.touches[0];
    this.updatePosition(touch.clientX, touch.clientY);
  }

  updatePosition(clientX, clientY) {
    const deltaX = clientX - this.startX;
    const deltaY = clientY - this.startY;

    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    
    if (distance > this.clickThreshold) {
      this.hasMovedEnough = true;
      this.element.classList.add('dragging');
    }

    if (!this.hasMovedEnough) return;

    const newX = this.element.offsetLeft + deltaX;
    const newY = this.element.offsetTop + deltaY;

    // Apply boundary constraints
    const constrainedX = Math.max(this.minX, Math.min(newX, this.maxX - this.element.offsetWidth));
    const constrainedY = Math.max(this.minY, Math.min(newY, this.maxY - this.element.offsetHeight));

    this.element.style.left = constrainedX + 'px';
    this.element.style.top = constrainedY + 'px';

    this.startX = clientX;
    this.startY = clientY;
  }

  onMouseUp = (e) => {
    this.endDrag(e.clientX, e.clientY);
  }

  onTouchEnd = (e) => {
    if (e.touches.length === 0) {
      const touch = e.changedTouches[0];
      this.endDrag(touch.clientX, touch.clientY);
    }
  }

  endDrag(clientX, clientY) {
    const distance = Math.sqrt(
      Math.pow(clientX - this.clickStartX, 2) + 
      Math.pow(clientY - this.clickStartY, 2)
    );

    this.isDragging = false;
    this.element.classList.remove('dragging');

    // If it was just a click (small distance), trigger click event
    if (distance < this.clickThreshold && this.element.onclick) {
      this.element.onclick(new MouseEvent('click'));
    }

    // Cleanup event listeners
    if (this.currentMouseMove) {
      document.removeEventListener('mousemove', this.currentMouseMove);
    }
    if (this.currentTouchMove) {
      document.removeEventListener('touchmove', this.currentTouchMove);
    }
    if (this.currentMouseUp) {
      document.removeEventListener('mouseup', this.currentMouseUp);
    }
    if (this.currentTouchEnd) {
      document.removeEventListener('touchend', this.currentTouchEnd);
    }
  }
}


/* ================= CREATE BUBBLES ================= */

function createBubble(user) {
  // Create container for dragging
  const bubbleContainer = document.createElement("div");
  bubbleContainer.className = "bubble-container";
  bubbleContainer.setAttribute('data-draggable', 'true');

  // Create bubble element
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const img = document.createElement("img");
  img.src = user.avatar || "BULKLOGO.png";
  img.onerror = () => img.src = "BULKLOGO.png";

  bubble.appendChild(img);
  bubbleContainer.appendChild(bubble);

  // Random position
  bubbleContainer.style.left =
    Math.random()*(innerWidth-60)+"px";

  bubbleContainer.style.top =
    Math.random()*(innerHeight-150)+"px";

  // Float animation with random delay
  const randomDelay = Math.random() * 2 + "s";
  bubble.style.animation =
    `float 8s ease-in-out infinite ${randomDelay}`;

  // Get header height for boundary constraint
  const headerHeight = header ? header.offsetHeight : 100;

  // Make bubble container draggable
  new DraggableElement(bubbleContainer, {
    minY: headerHeight + 10,
    maxY: window.innerHeight,
    minX: 0,
    maxX: window.innerWidth
  });

  // Click
  bubbleContainer.onclick = ()=>{
    bubble.style.animation="clickPop .5s cubic-bezier(0.34, 1.56, 0.64, 1)";

    setTimeout(()=>{
      bubble.style.animation=
        `float 8s ease-in-out infinite ${randomDelay}`;
    },500);

    playSound(user.audio);
    showPopup(user);
  };

  document.body.appendChild(bubbleContainer);
}

// Initialize existing users
users.forEach(user => createBubble(user));


/* ================= MAKE HEADER DRAGGABLE ================= */

if (header) {
  new DraggableElement(header);
}


/* ================= AUTO-MAKE FUTURE ELEMENTS DRAGGABLE ================= */

const observer = new MutationObserver((mutations) => {
  mutations.forEach((mutation) => {
    mutation.addedNodes.forEach((node) => {
      if (node.nodeType === 1) { // Element node
        if (node.hasAttribute('data-draggable') && !node._isDraggableInitialized) {
          const headerHeight = header ? header.offsetHeight : 100;
          new DraggableElement(node, {
            minY: headerHeight + 10,
            maxY: window.innerHeight,
            minX: 0,
            maxX: window.innerWidth
          });
          node._isDraggableInitialized = true;
        }
      }
    });
  });
});

observer.observe(document.body, {
  childList: true,
  subtree: true
});

</script>
